name: Build SharpEntry Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SharpEntry/**"
      - ".github/workflows/sharpentry-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SharpEntry
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SharpEntry-debug-apk
          path: SharpEntry/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
