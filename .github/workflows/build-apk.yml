name: Build EliteTrade AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'feat/**' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check Maven dependency access
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://repo.maven.apache.org/maven2/org/slf4j/slf4j-api/1.7.30/slf4j-api-1.7.30.pom"
            "https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.10.1/gson-2.10.1.pom"
            "https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib-jdk8/1.9.20/kotlin-stdlib-jdk8-1.9.20.pom"
          )
          for url in "${urls[@]}"; do
            echo "Checking dependency: $url"
            if ! status=$(curl --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 --output /dev/null --write-out '%{http_code}' "$url"); then
              echo "::error::Cannot reach Maven Central for $url"
              exit 1
            fi
            echo "HTTP status: $status"
            if [ "$status" != "200" ]; then
              echo "::error::Expected HTTP 200 but received $status for $url"
              exit 1
            fi
          done
      - name: Smoke-test public live market feed
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, json, time, urllib.error, urllib.request
          symbols = ("XAUUSD", "BTCUSD")
          intervals = {"1m": 180, "15m": 1200}
          now = time.time()
          for symbol in symbols:
              for interval, max_age in intervals.items():
                  url = f"https://biquote.io/api/{symbol}/ohlc?interval={interval}&limit=60"
                  req = urllib.request.Request(url, headers={"User-Agent": "EliteTradeAI-CI-smoke-test/1.0"})
                  try:
                      with urllib.request.urlopen(req, timeout=15) as response:
                          if response.status != 200:
                              raise RuntimeError(f"HTTP {response.status}")
                          data = json.loads(response.read().decode("utf-8"))
                  except Exception as exc:
                      raise SystemExit(f"FAIL {symbol} {interval}: feed request failed: {exc}")
                  bars = data.get("bars")
                  if not isinstance(bars, list) or len(bars) < 30:
                      raise SystemExit(f"FAIL {symbol} {interval}: expected at least 30 candles")
                  latest = max(bars, key=lambda bar: bar["openTime"])
                  stamp = datetime.datetime.fromisoformat(latest["openTime"].replace("Z", "+00:00")).timestamp()
                  age = now - stamp
                  if age < -60 or age > max_age:
                      raise SystemExit(f"FAIL {symbol} {interval}: latest candle is stale/future-dated (age={age:.0f}s)")
                  for key in ("high", "low", "close"):
                      float(latest[key])
                  print(f"PASS {symbol} {interval}: HTTP 200, {len(bars)} candles, latest candle age {age:.0f}s")
          PY
      - name: Run unit tests and build debug APK
        run: gradle --no-daemon --refresh-dependencies testDebugUnitTest assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EliteTradeAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
