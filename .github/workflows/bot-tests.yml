name: EliteTrade AI quality checks

on:
  push:
    branches: [pepperstone-ctrader-bot]
  pull_request:
    branches: [pepperstone-ctrader-bot]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt coverage
          python -m pip check
          python -c "from ctrader_open_api import Client, EndPoints, Protobuf, TcpProtocol; from ctrader_open_api.messages.OpenApiMessages_pb2 import ProtoOAApplicationAuthReq; ProtoOAApplicationAuthReq(); print('Vendored Spotware SDK import: OK')"
      - name: Run unit tests with coverage
        run: |
          PYTHONPATH=. coverage run --branch --source=elite_trade -m unittest discover -s tests -v
          coverage report -m
      - name: Save coverage report
        if: always()
        run: coverage report -m > coverage-report.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elitetrade-coverage-report
          path: bot/coverage-report.txt
          if-no-files-found: ignore

  static-quality:
    name: Lint and source security checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - name: Install project and analysis tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff bandit
          python -m pip check
      - name: Ruff lint
        run: ruff check elite_trade tests main.py
      - name: Bandit security scan
        run: bandit -q -r elite_trade

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - name: Install audit tool
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit declared dependencies
        run: pip-audit -r requirements.txt

  package-build:
    name: Build and import wheel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - name: Install build tools and runtime dependencies
        run: |
          python -m pip install --upgrade pip build
          pip install -r requirements.txt
          python -m pip check
      - name: Build wheel
        run: python -m build --wheel
      - name: Install wheel and smoke-test package import
        run: |
          python -m pip install --no-deps dist/*.whl
          python -c "import elite_trade; from ctrader_open_api import Client; print('EliteTrade AI and cTrader SDK package imports: OK')"
