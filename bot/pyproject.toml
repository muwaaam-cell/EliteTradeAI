[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elitetrade-ai"
version = "0.1.0"
description = "Pepperstone cTrader automated trading bot foundation"
requires-python = ">=3.11"
dependencies = [
  "ctrader-open-api",
  "python-dotenv",
  "cryptography>=42.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["elite_trade*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Keep CI focused on syntax, pycodestyle correctness and Pyflakes until
# broader rules are introduced and remediated deliberately.
select = ["E4", "E7", "E9", "F"]
